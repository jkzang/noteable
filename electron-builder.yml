appId: app.noteable.desktop
productName: Noteable
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.{map,md}'
asarUnpack: []
mac:
  category: public.app-category.productivity
  target: [dmg, zip]
win:
  target: [nsis]
linux:
  category: Office
  target: [AppImage, deb]
